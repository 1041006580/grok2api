<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="xai.pageTitle">Grok2API - xAI Keys</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-mono/style.css" rel="stylesheet">
  <link href="/static/common/css/common.css?v=1.6.2" rel="stylesheet">
  <link href="/static/admin/css/token.css?v=1.6.2" rel="stylesheet">
  <link href="/static/common/css/toast.css" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col" style="background-color: var(--bg);">

  <div id="toast-container" class="toast-container"></div>
  <div id="app-header"></div>

  <main class="space-y-6 flex-1 container mx-auto max-w-5xl px-6 py-8 fade-in">
    <div class="space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight" data-i18n="xai.title">xAI Keys</h2>
          <p class="text-[var(--accents-4)] mt-1 text-sm">Manage xAI keys, manual enablement, and current availability.</p>
        </div>
        <button id="create-xai-key-btn" type="button" class="geist-button gap-2" onclick="openCreateModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New Key</span>
        </button>
      </div>

      <div class="h-px bg-[var(--border)] my-6"></div>

      <div class="rounded-lg overflow-hidden bg-white mb-4 overflow-x-auto">
        <table class="geist-table min-w-[760px]">
          <thead>
            <tr>
              <th class="text-left">Name</th>
              <th class="text-left">Masked Value</th>
              <th class="text-center">Enabled</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="xai-keys-table-body">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
        <div id="loading" class="text-center py-12 text-[var(--accents-4)]">Loading...</div>
        <div id="empty-state" class="hidden table-empty">
          No xAI keys configured yet.
        </div>
      </div>
    </div>
  </main>

  <div id="xai-key-modal" class="modal-overlay hidden">
    <div class="modal-content modal-md" id="xai-key-modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Create xAI Key</h3>
        <button onclick="closeCreateModal()" class="modal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label for="xai-key-name" class="modal-label mb-1 block">Name</label>
          <input id="xai-key-name" class="geist-input w-full" placeholder="Primary / Backup">
        </div>
        <div>
          <label for="xai-key-value" class="modal-label mb-1 block">Key</label>
          <input id="xai-key-value" class="geist-input w-full font-mono" placeholder="xai-...">
        </div>
        <label class="flex items-center gap-2 text-sm text-[var(--accents-5)]">
          <input id="xai-key-enabled" type="checkbox" checked>
          <span>Enable immediately</span>
        </label>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="geist-button-outline text-xs px-3" onclick="closeCreateModal()">Cancel</button>
          <button type="button" class="geist-button text-xs px-3" onclick="saveXAIKey()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/static/i18n/i18n.js"></script>
  <script src="/static/common/js/admin-auth.js?v=1.6.2"></script>
  <script src="/static/common/js/header.js?v=1.6.2"></script>
  <script src="/static/common/js/footer.js?v=1.6.2"></script>
  <script src="/static/common/js/toast.js"></script>
  <script src="/static/admin/js/xai-keys.js?v=1.6.2"></script>
</body>

</html>
